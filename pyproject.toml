[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dotaudio"
version = "0.1.0"
description = "Whisper desktop workspace: dictation, live captions, media and broadcasts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "faster-whisper>=1.2,<2", "numpy>=1.26,<3",
  "sounddevice>=0.5,<1", "soundcard>=0.4,<1", "httpx>=0.28,<1",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]
build = ["pyinstaller>=6.12,<7"]
# Запасной движок голосов: один эмбеддинг на фразу и кластеризация. Тянет
# torch, поэтому опционален. Движок по умолчанию (NVIDIA NeMo) сюда не
# входит вовсе: это нативный рантайм NeMo-Speech.cpp, он ставится своим
# установщиком и не является пакетом Python. Пакет `nemo_toolkit` здесь
# неприменим - Windows у него в статусе «No support yet».
diarize = ["torch>=2.3", "speechbrain>=1.0"]
# Лёгкий Kaldi-движок Live для очень слабого CPU. Выбирается вручную в
# настройках; по умолчанию Live идёт на faster-whisper.
vosk = ["vosk>=0.3.45,<1"]
# Локальный ассистент по расшифровкам. Нативная сборка, поэтому опционально:
# без неё приложение работает, только страница «Ассистент» просит установку.
# Готовые колёса под CPU и ускорители лежат в отдельных индексах, например
# pip install llama-cpp-python --extra-index-url
#   https://abetlen.github.io/llama-cpp-python/whl/cpu
llm = ["llama-cpp-python>=0.3,<1"]
# CUDA runtime для Whisper на Windows без полного Toolkit. Ставится из UI
# («Настроить GPU») или вручную: pip install -e ".[cuda]".
cuda = [
  "nvidia-cublas-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-cudnn-cu12",
  "nvidia-cuda-nvrtc-cu12",
]

[project.scripts]
dotaudio = "dotaudio.app:main"
dotaudio-server = "dotaudio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Theme.js импортируется из QML как обычный файл рядом с компонентами, и без
# него собранный пакет остаётся без токенов оформления.
dotaudio = ["qml/*.qml", "qml/*.js", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

