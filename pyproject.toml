[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dotaudio"
version = "0.1.0"
description = "Whisper desktop workspace: dictation, live captions, media and broadcasts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "faster-whisper>=1.2,<2", "numpy>=1.26,<3",
  "sounddevice>=0.5,<1", "soundcard>=0.4,<1", "httpx>=0.28,<1",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]
build = ["pyinstaller>=6.12,<7"]
# Идентификация голосов при транскрибации файла. Тяжёлое/нативное, поэтому
# опционально: без него приложение работает, только говорящие не определяются.
diarize = ["torch>=2.3", "speechbrain>=1.0"]

[project.scripts]
dotaudio = "dotaudio.app:main"
dotaudio-server = "dotaudio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dotaudio = ["qml/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

